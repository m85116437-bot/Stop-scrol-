<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Scroll — Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #555;
    --accent: #c8f564;
    --fail: #ff5c5c;
    --win: #c8f564;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
    max-width: 420px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 32px;
  }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* Streak bar */
  .streak-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .streak-num {
    font-family: 'Space Mono', monospace;
    font-size: 40px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .streak-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .streak-msg {
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
  }

  /* Today check-in */
  .checkin {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .checkin h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 16px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.05em;
  }

  .checkin-question {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .btn-row {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn:hover { border-color: var(--muted); }
  .btn.win { background: var(--win); color: #0d0d0d; border-color: var(--win); }
  .btn.fail { background: var(--fail); color: #fff; border-color: var(--fail); }
  .btn.selected-win { background: var(--win); color: #0d0d0d; border-color: var(--win); }
  .btn.selected-fail { background: var(--fail); color: #fff; border-color: var(--fail); }

  /* Notes */
  .note-input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    resize: none;
    margin-top: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .note-input:focus { border-color: var(--accent); }
  .note-input::placeholder { color: var(--muted); }

  .save-btn {
    margin-top: 10px;
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .save-btn:hover { opacity: 0.85; }

  /* Grid */
  .grid-section h2 {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 28px;
  }

  .day-cell {
    aspect-ratio: 1;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s;
  }
  .day-cell:active { transform: scale(0.95); }
  .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .day-cell.status-win { background: var(--win); color: #0d0d0d; border-color: var(--win); }
  .day-cell.status-fail { background: #2a1010; border-color: var(--fail); color: var(--fail); }
  .day-cell.today { box-shadow: 0 0 0 2px var(--accent); }

  /* Log */
  .log-section h2 {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .log-item {
    border-left: 2px solid var(--border);
    padding: 10px 14px;
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  .log-item.win { border-color: var(--win); }
  .log-item.fail { border-color: var(--fail); }

  .log-date {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .log-status {
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 3px;
  }
  .log-item.win .log-status { color: var(--win); }
  .log-item.fail .log-status { color: var(--fail); }

  .log-note { color: var(--text); }

  .empty-log {
    color: var(--muted);
    font-size: 13px;
    padding: 16px 0;
  }

  .reset-btn {
    margin-top: 32px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .reset-btn:hover { color: var(--fail); border-color: var(--fail); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--accent);
    color: #0d0d0d;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 99px;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    z-index: 99;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">30-day challenge</div>
  <h1>No <span>Scroll</span></h1>
  <p class="subtitle">Tiap hari, satu pertanyaan jujur.</p>
</header>

<div class="streak-bar">
  <div>
    <div class="streak-num" id="streak-num">0</div>
    <div class="streak-label">hari streak</div>
  </div>
  <div class="streak-msg" id="streak-msg">Mulai hari ini. Satu hari cukup.</div>
</div>

<div class="checkin" id="checkin-section">
  <h2>HARI INI — <span id="today-label"></span></h2>
  <div class="checkin-question" id="checkin-q">Apakah kamu berhasil tidak scroll video pendek hari ini?</div>
  <div class="btn-row" id="btn-row">
    <button class="btn" id="btn-yes" onclick="selectStatus('win')">✓ Berhasil</button>
    <button class="btn" id="btn-no" onclick="selectStatus('fail')">✗ Gagal</button>
  </div>
  <textarea class="note-input" id="note-input" rows="2" placeholder="Catatan singkat (opsional)..."></textarea>
  <button class="save-btn" onclick="saveToday()">Simpan hari ini</button>
</div>

<div class="grid-section">
  <h2>30 Hari</h2>
  <div class="grid" id="grid"></div>
</div>

<div class="log-section">
  <h2>Catatan</h2>
  <div id="log-list"></div>
</div>

<button class="reset-btn" onclick="resetAll()">Reset semua data</button>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'noscroll_v1';
  let data = loadData();
  let selectedStatus = null;

  function loadData() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { days: {} };
    } catch { return { days: {} }; }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function todayKey() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatDate(key) {
    const [y, m, d] = key.split('-');
    return `${d}/${m}/${y}`;
  }

  function selectStatus(s) {
    selectedStatus = s;
    document.getElementById('btn-yes').className = 'btn' + (s === 'win' ? ' selected-win' : '');
    document.getElementById('btn-no').className = 'btn' + (s === 'fail' ? ' selected-fail' : '');
  }

  function saveToday() {
    if (!selectedStatus) { showToast('Pilih dulu ya — berhasil atau gagal'); return; }
    const key = todayKey();
    const note = document.getElementById('note-input').value.trim();
    data.days[key] = { status: selectedStatus, note };
    saveData();
    showToast(selectedStatus === 'win' ? '🔥 Dicatat! Pertahankan.' : '📝 Dicatat. Besok coba lagi.');
    render();
  }

  function calcStreak() {
    let streak = 0;
    let d = new Date();
    while (true) {
      const key = d.toISOString().slice(0, 10);
      const entry = data.days[key];
      if (entry && entry.status === 'win') {
        streak++;
        d.setDate(d.getDate() - 1);
      } else break;
    }
    return streak;
  }

  function streakMsg(n) {
    if (n === 0) return 'Mulai hari ini. Satu hari cukup.';
    if (n < 3) return 'Awal yang bagus. Jangan berhenti.';
    if (n < 7) return 'Otakmu mulai beradaptasi.';
    if (n < 14) return 'Satu minggu lebih! Fokus makin tajam.';
    if (n < 21) return 'Dua minggu. Kebiasaan baru terbentuk.';
    return '🏆 Lebih dari 3 minggu. Luar biasa.';
  }

  function buildGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const today = todayKey();
    const start = new Date(today);
    start.setDate(start.getDate() - 29);

    for (let i = 0; i < 30; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = d.toISOString().slice(0, 10);
      const cell = document.createElement('div');
      const dayNum = d.getDate();
      cell.className = 'day-cell';
      cell.textContent = dayNum;
      if (data.days[key]) {
        cell.classList.add('status-' + data.days[key].status);
      }
      if (key === today) cell.classList.add('today');
      grid.appendChild(cell);
    }
  }

  function buildLog() {
    const el = document.getElementById('log-list');
    const keys = Object.keys(data.days).sort((a, b) => b.localeCompare(a)).slice(0, 10);
    if (!keys.length) {
      el.innerHTML = '<p class="empty-log">Belum ada catatan.</p>';
      return;
    }
    el.innerHTML = keys.map(k => {
      const e = data.days[k];
      return `<div class="log-item ${e.status}">
        <div class="log-date">${formatDate(k)}</div>
        <div class="log-status">${e.status === 'win' ? 'Berhasil' : 'Gagal'}</div>
        ${e.note ? `<div class="log-note">${e.note}</div>` : ''}
      </div>`;
    }).join('');
  }

  function buildCheckin() {
    const key = todayKey();
    const label = formatDate(key);
    document.getElementById('today-label').textContent = label;
    const existing = data.days[key];
    if (existing) {
      selectedStatus = existing.status;
      document.getElementById('btn-yes').className = 'btn' + (existing.status === 'win' ? ' selected-win' : '');
      document.getElementById('btn-no').className = 'btn' + (existing.status === 'fail' ? ' selected-fail' : '');
      document.getElementById('note-input').value = existing.note || '';
    }
  }

  function render() {
    const streak = calcStreak();
    document.getElementById('streak-num').textContent = streak;
    document.getElementById('streak-msg').textContent = streakMsg(streak);
    buildGrid();
    buildLog();
    buildCheckin();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  function resetAll() {
    if (!confirm('Reset semua data? Ini tidak bisa di-undo.')) return;
    data = { days: {} };
    saveData();
    selectedStatus = null;
    document.getElementById('btn-yes').className = 'btn';
    document.getElementById('btn-no').className = 'btn';
    document.getElementById('note-input').value = '';
    render();
    showToast('Data direset.');
  }

  render();
</script>
</body>
</html>
